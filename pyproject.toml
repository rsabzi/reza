[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "frontend"]

[tool.ruff.lint]
# FastAPI intentionally uses Depends() defaults; boundary layers intentionally
# catch Exception so provider/tool errors become audited HTTP failures.
ignore = ["B008", "BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
